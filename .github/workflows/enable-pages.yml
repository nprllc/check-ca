name: Activer GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Activer Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "::group::gh auth"
          gh auth status 2>&1 || true
          echo "::endgroup::"
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nprllc/check-ca/pages \
            -d '{"source":{"branch":"main","path":"/docs"}}')
          echo "POST HTTP $code"
          cat /tmp/resp.json || true
          if [ "$code" = "201" ]; then echo "::notice::Pages active (201)"; exit 0; fi
          if [ "$code" = "409" ]; then echo "::notice::Pages deja active (409)"; exit 0; fi
          echo "::error::POST $code $(head -c 300 /tmp/resp.json)"
          g2=$(curl -s -o /tmp/s.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/nprllc/check-ca/pages)
          echo "GET HTTP $g2"
          cat /tmp/s.json || true
          echo "::error::GET $g2 $(head -c 300 /tmp/s.json)"
          exit 1
