name: Activer GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Activer Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api -X POST /repos/nprllc/check-ca/pages \
            -f 'source[branch]=main' -f 'source[path]=/docs' > /tmp/out.json 2>/tmp/err.txt
          code=$?
          cat /tmp/out.json /tmp/err.txt || true
          gh api /repos/nprllc/check-ca/pages > /tmp/status.json 2>&1 || true
          cat /tmp/status.json || true
          if [ "$code" != "0" ]; then
            gh api /repos/nprllc/check-ca/pages && exit 0
            exit 1
          fi
